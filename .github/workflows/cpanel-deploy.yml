name: Deploy to cPanel

on:
  push:
    branches:
      - main
    paths:
      - "mkdesigning-react/**"
      - ".github/workflows/cpanel-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mkdesigning-react

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mkdesigning-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          test -s mk-build/index.html || {
            echo "Build output missing or empty"
            exit 1
          }
          echo "Build output verified"

      - name: Deploy build to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: mkdesigning-react/mk-build/
          server-dir: ../../../../public_html/
          timeout: 120000
          log-level: verbose