name: Deploy to cPanel

on:
  push:
    branches:
      - main
    paths:
      - "mkdesigning-react/**"
      - ".github/workflows/cpanel-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkdesigning-react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mkdesigning-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          if [ -f mk-build/index.html ]; then
            echo "Build output confirmed at mk-build/index.html"
          else
            echo "Build output missing at mk-build/index.html"
            exit 1
          fi

      - name: Deploy build to cPanel over FTPS
        if: ${{ secrets.CPANEL_FTP_USERNAME != '' && secrets.CPANEL_FTP_PASSWORD != '' && secrets.CPANEL_SERVER_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.mkdesigning.in
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: mkdesigning-react/mk-build/
          server-dir: /public_html
          timeout: 60000
          log-level: verbose

      - name: Skip deployment if cPanel secrets are missing
        if: ${{ secrets.CPANEL_FTP_USERNAME == '' || secrets.CPANEL_FTP_PASSWORD == '' || secrets.CPANEL_SERVER_DIR == '' }}
        run: echo "Skipping deployment because cPanel secrets are not configured in GitHub repository settings."
