
      - name: Deploy build to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.mkdesigning.in
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: mkdesigning-react/mk-build/
          server-dir: ${{ secrets.CPANEL_SERVER_DIR }}
          timeout: 60000
          log-level: standard
